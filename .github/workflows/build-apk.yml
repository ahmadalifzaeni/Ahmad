name: Build Lumina F7 APK

on:
  push:
    branches: [ "**" ]
  release:
    types: [ published, created ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Lumina F7 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          [ -f .env.example ] || touch .env.example

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare Lumina-F7.apk
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/Lumina-F7.apk
          ls -lh release-apk/Lumina-F7.apk

      - name: Upload Lumina-F7-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-F7-APK
          path: release-apk/Lumina-F7.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach Lumina-F7.apk to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            gh release upload "$TAG" release-apk/Lumina-F7.apk --clobber
          else
            TAG="latest-apk"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" release-apk/Lumina-F7.apk --clobber
            else
              gh release create "$TAG" release-apk/Lumina-F7.apk \
                --target "${{ github.sha }}" \
                --title "Lumina F7 (Latest APK)" \
                --notes "File APK Lumina F7 siap pasang untuk Poco F7. Ketuk Lumina-F7.apk di bagian Assets untuk langsung mengunduh." \
                --latest
            fi
          fi
